name: Sync main to droplet

on:
  push:
    branches:
      - main

concurrency:
  group: harmony-droplet-production
  cancel-in-progress: false

jobs:
  sync:
    name: Update droplet checkout
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Pull main and install server dependencies
        env:
          DROPLET_HOST: 164.90.134.165
          DROPLET_USER: mern
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DROPLET_USER@$DROPLET_HOST" \
            'set -eu
             git -C /home/mern/repo pull --ff-only origin main
             ln -sfn /home/mern/harmonyapp.us/server/.env /home/mern/repo/server/.env
             npm ci --prefix /home/mern/repo/server
             node -e "const result = require('/home/mern/repo/server/node_modules/dotenv').config({ path: '/home/mern/repo/server/.env' }); if (!result.parsed || !result.parsed.MONGO_URI) { console.error('MONGO_URI missing from server env'); process.exit(1); } console.log('MONGO_URI loaded from server env');"
             pm2 startOrReload /home/mern/repo/server/ecosystem.config.cjs --env production --update-env
             pm2 save
             attempt=0
             until curl --fail --silent --show-error http://127.0.0.1:4000/api/ping >/dev/null; do
               attempt=$((attempt + 1))
               if [ "$attempt" -ge 30 ]; then
                 pm2 status
                 pm2 logs harmony-api --lines 100 --nostream
                 exit 1
               fi
               sleep 2
             done
             echo "Harmony API is healthy on port 4000"'
